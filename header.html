<style>
  /* Header Base Container */
  header.site-header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 40px;
    z-index: 1000;
    background-color: transparent;
    transition: background-color 0.3s ease, box-shadow 0.3s ease, border-bottom 0.3s ease;
    box-sizing: border-box;
  }

  /* Header Scrolled State */
  header.site-header.scrolled {
    background-color: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
  }

  /* Logo */
  .header-logo a {
    font-size: 1.8rem;
    font-weight: 900;
    color: #111111;
    text-decoration: none;
    letter-spacing: -1px;
  }

  /* Main Navigation List */
  .header-nav ul.nav-menu {
    display: flex;
    align-items: center;
    list-style: none;
    gap: 28px;
    margin: 0;
    padding: 0;
  }

  .header-nav ul.nav-menu > li {
    position: relative;
    padding: 25px 0; /* Creates seamless hover bridge to dropdown */
  }

  .header-nav ul.nav-menu > li > a {
    text-decoration: none;
    color: #111111;
    font-weight: 500;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: opacity 0.2s ease;
  }

  .header-nav ul.nav-menu > li:hover > a {
    opacity: 0.7;
  }

  /* Chevron Indicator */
  .chevron-icon {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-right: 1.5px solid #111111;
    border-bottom: 1.5px solid #111111;
    transform: rotate(45deg) translateY(-2px);
    transition: transform 0.2s ease;
  }

  .header-nav ul.nav-menu > li:hover .chevron-icon {
    transform: rotate(-135deg) translateY(-2px);
  }

  /* Dropdown Menu Box */
  .dropdown-menu {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 240px;
    background-color: #ffffff;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    padding: 24px 28px;
    list-style: none;
    margin: 0;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
    border-radius: 2px;
    pointer-events: none;
  }

  /* Active Dropdown Trigger */
  .header-nav ul.nav-menu > li:hover .dropdown-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
    pointer-events: auto;
  }

  /* Dropdown Links */
  .dropdown-menu li {
    padding: 0;
    margin-bottom: 18px;
  }

  .dropdown-menu li:last-child {
    margin-bottom: 0;
  }

  .dropdown-menu a {
    text-decoration: none;
    color: #111111;
    font-size: 0.95rem;
    font-weight: 500;
    white-space: nowrap;
    transition: color 0.2s ease;
  }

  .dropdown-menu a:hover {
    color: #555555;
  }

  .dropdown-menu a.disabled {
    color: #aaaaaa;
    pointer-events: none;
  }

  /* Sign In Button */
  .btn-sign-in {
    background-color: #111111;
    color: #ffffff;
    padding: 10px 24px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
    transition: background-color 0.2s ease;
  }

  .btn-sign-in:hover {
    background-color: #333333;
  }
</style>

<header class="site-header">
  <div class="header-logo">
    <a href="index.html">FIND</a>
  </div>
  
  <nav class="header-nav">
    <ul class="nav-menu">
      <li><a href="search.html">Search</a></li>
      <li><a href="agents.html">Agents</a></li>
      
      <!-- Join Dropdown -->
      <li>
        <a href="#">Join <span class="chevron-icon"></span></a>
        <ul class="dropdown-menu">
          <li><a href="newyork.html">New York City</a></li>
          <li><a href="philadelphia.html">Philadelphia</a></li>
          <li><a href="#" class="disabled">Boston (coming soon)</a></li>
        </ul>
      </li>
      
      <!-- Paperwork Dropdown -->
      <li>
        <a href="#">Paperwork <span class="chevron-icon"></span></a>
        <ul class="dropdown-menu">
          <li><a href="submit application.html">Submit an Application</a></li>

        </ul>
      </li>
      
      <!-- About Dropdown -->
      <li>
        <a href="#">About <span class="chevron-icon"></span></a>
        <ul class="dropdown-menu">
          <li><a href="about.html">About Us</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="press.html">Press</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <div class="header-actions">
    <a href="#" class="btn-sign-in">Sign In</a>
  </div>
</header>

<script>
  (() => {
    const header = document.querySelector('header.site-header');
    const whySection = document.querySelector('.why-section');

    const handleScroll = () => {
      if (!header) return;
      if (whySection) {
        const whySectionTop = whySection.getBoundingClientRect().top;
        if (whySectionTop <= 80) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      } else {
        if (window.scrollY > 50) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }
      }
    };

    window.addEventListener('scroll', handleScroll);
    handleScroll();
  })();
</script>
